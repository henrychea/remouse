      const ns = 'http://www.w3.org/2000/svg';
      const bodyOutline = new Set([
        '6,1','7,1','8,1','9,1','10,1','4,2','5,2','11,2','12,2','3,3','13,3','2,4','14,4',

      ]);
      const arrowUp = new Set(['8,4','7,5','8,5','9,5','6,6','8,6','10,6','8,7','8,8','8,9','8,10']);
      for (let r = 0; r < 21; r++) {
        for (let c = 0; c < 17; c++) {
          const key = c + ',' + r;
          const circle = document.createElementNS(ns, 'circle');
          circle.setAttribute('cx', String((5.2 + c * 4.6).toFixed(1)));
          circle.setAttribute('cy', String((6.0 + r * 4.6).toFixed(1)));
          if (arrowUp.has(key)) {
            circle.setAttribute('r', '1.65');
            circle.setAttribute('fill', '#4DA8FF');
            circle.classList.add('mint-bloom');
          } else if (bodyOutline.has(key)) {
            circle.setAttribute('r', '1.35');
            circle.setAttribute('fill', '#E4FFF4');
            circle.setAttribute('opacity', '0.88');
          } else {
            circle.setAttribute('r', '0.8');
            circle.setAttribute('fill', '#222228');
            circle.setAttribute('opacity', '0.45');
          }
          svg.appendChild(circle);
        }
      }

      const disclosureBtn = document.getElementById('conflict-disclosure-btn');
      const details = document.getElementById('conflict-details');
      const chevron = document.getElementById('conflict-chevron');
      const quitBtn = document.getElementById('quit-conflict-btn');
      const banner = document.getElementById('conflict-banner');

      disclosureBtn.addEventListener('click', () => {
        const expanded = disclosureBtn.getAttribute('aria-expanded') === 'true';
        const next = !expanded;
        disclosureBtn.setAttribute('aria-expanded', String(next));
        if (next) {
          details.classList.remove('hidden');
          chevron.style.transform = 'rotate(180deg)';
        } else {
          details.classList.add('hidden');
          chevron.style.transform = 'rotate(0deg)';
        }
      });

      quitBtn.addEventListener('click', () => {
        banner.classList.add('opacity-0', 'scale-95', 'transition-transform', 'duration-state-change');
        setTimeout(() => banner.setAttribute('hidden', 'true'), 180);
      });
    })();
