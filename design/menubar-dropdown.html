  <script>
    (function () {
      const btn = document.getElementById('menu-invert-toggle');
      const label = document.getElementById('menu-toggle-label');
      const track = document.getElementById('menu-toggle-track');
      const thumb = document.getElementById('menu-toggle-thumb');
      let on = true;
      btn.addEventListener('click', () => {
        on = !on;
        btn.setAttribute('aria-checked', String(on));
        if (on) {
          label.className = 'font-label text-label-md text-primary uppercase tracking-wider';
          track.className = 'inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-primary-container border border-primary p-0.5 transition-colors duration-state-change';
          thumb.className = 'h-3.5 w-3.5 rounded-full bg-primary translate-x-4 transition-transform duration-state-change';
        } else {
          label.className = 'font-label text-label-md text-on-surface-variant uppercase tracking-wider';
          track.className = 'inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-surface-container-highest border border-outline-variant p-0.5 transition-colors duration-state-change';
          thumb.className = 'h-3.5 w-3.5 rounded-full bg-on-surface-variant translate-x-0 transition-transform duration-state-change';
        }
      });
