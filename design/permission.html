  <script>
    (function () {
      const svg = document.getElementById('lock-matrix');
      const ns = 'http://www.w3.org/2000/svg';

      // High-density 17x18 Nothing OS-style padlock
      const shackleDots = new Set([
        '6,1','7,1','8,1','9,1','10,1',
        '5,2','11,2',
        '4,3','12,3',
        '4,4','12,4',
        '4,5','12,5',
        '4,6','12,6'
      ]);
      const bodyDots = new Set([
        '3,7','4,7','5,7','6,7','7,7','8,7','9,7','10,7','11,7','12,7','13,7',
        '2,8','14,8',
        '2,9','14,9',
        '2,10','14,10',
        '2,11','14,11',
        '2,12','14,12',
        '2,13','14,13',
        '2,14','14,14',
        '3,15','4,15','5,15','6,15','7,15','8,15','9,15','10,15','11,15','12,15','13,15'
      ]);
      const keyholeDots = new Set(['8,10','7,11','8,11','9,11','8,12','8,13']);

      for (let r = 0; r < 18; r++) {
        for (let c = 0; c < 17; c++) {
          const key = c + ',' + r;
          const circle = document.createElementNS(ns, 'circle');
          circle.setAttribute('cx', String((5.2 + c * 4.6).toFixed(1)));
          circle.setAttribute('cy', String((5.5 + r * 4.6).toFixed(1)));
          if (keyholeDots.has(key)) {
            circle.setAttribute('r', '1.65');
            circle.setAttribute('fill', '#4DA8FF');
            circle.classList.add('mint-bloom');
          } else if (shackleDots.has(key) || bodyDots.has(key)) {
            circle.setAttribute('r', '1.35');
            circle.setAttribute('fill', '#F0F0F2');
            circle.setAttribute('opacity', '0.9');
          } else {
            circle.setAttribute('r', '0.8');
            circle.setAttribute('fill', '#222228');
            circle.setAttribute('opacity', '0.45');
          }
          svg.appendChild(circle);
        }
      }
    })();
  </script>
