  <script>
    (function () {
      const svg = document.getElementById('mouse-matrix');
      const cols = 17;
      const rows = 21;
      const step = 4.6;
      const offsetX = 5.2;
      const offsetY = 6.0;

      // High-density Nothing OS-style mouse silhouette (17x21)
      const bodyOutline = new Set([
        '6,1','7,1','8,1','9,1','10,1',
        '4,2','5,2','11,2','12,2',
        '3,3','13,3',
        '2,4','14,4',
        '2,5','14,5',
        '2,6','14,6',
        '2,7','14,7',
        '2,8','14,8',
        '2,9','14,9',
        '2,10','14,10',
        '2,11','14,11',
        '2,12','14,12',
        '2,13','14,13',
        '2,14','14,14',
        '2,15','14,15',
        '3,16','13,16',
        '3,17','13,17',
        '4,18','5,18','11,18','12,18',
        '6,19','7,19','8,19','9,19','10,19'
      ]);

      // Crisp scroll-wheel arrow up (inverted = true)
      const arrowUp = new Set([
        '8,4',
        '7,5','8,5','9,5',
        '6,6','8,6','10,6',
        '8,7',
        '8,8',
        '8,9',
        '8,10'
      ]);

      // Crisp scroll-wheel arrow down (inverted = false)
      const arrowDown = new Set([
        '8,4',
        '8,5',
        '8,6',
        '8,7',
        '6,8','8,8','10,8',
        '7,9','8,9','9,9',
        '8,10'
      ]);

      // Subtle button divider seam
      const seamDots = new Set(['3,11','4,11','5,11','6,11','7,11','8,11','9,11','10,11','11,11','12,11','13,11']);

      const dotMap = new Map();
      const ns = 'http://www.w3.org/2000/svg';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const key = c + ',' + r;
          const circle = document.createElementNS(ns, 'circle');
          circle.setAttribute('cx', String((offsetX + c * step).toFixed(1)));
          circle.setAttribute('cy', String((offsetY + r * step).toFixed(1)));
          circle.setAttribute('r', '0.9');
          circle.classList.add('led-dot');
          svg.appendChild(circle);
          dotMap.set(key, { el: circle, c, r });
        }
      }

      let inverted = true;

      function renderMatrix(animateRipple) {
        const activeArrow = inverted ? arrowUp : arrowDown;
        const centerC = 8;
        const centerR = 7;

        dotMap.forEach(({ el, c, r }, key) => {
          const dist = Math.hypot(c - centerC, r - centerR);
          const delay = animateRipple ? Math.round(dist * 18) : 0;
          el.style.transitionDelay = delay + 'ms';

          if (activeArrow.has(key)) {
            const cascadeDelay = animateRipple ? (inverted ? (10 - r) * 24 : (r - 4) * 24) : 0;
            el.style.transitionDelay = cascadeDelay + 'ms';
            el.setAttribute('fill', inverted ? '#4DA8FF' : '#FF5449');
            el.setAttribute('opacity', '1');
            el.setAttribute('r', '1.65');
            if (inverted) {
              el.classList.add('mint-bloom');
              el.classList.remove('red-bloom');
            } else {
              el.classList.add('red-bloom');
              el.classList.remove('mint-bloom');
            }
          } else if (bodyOutline.has(key)) {
            el.setAttribute('fill', inverted ? '#E4FFF4' : '#52525B');
            el.setAttribute('opacity', inverted ? '0.9' : '0.65');
            el.setAttribute('r', '1.35');
            el.classList.remove('mint-bloom', 'red-bloom');
          } else if (seamDots.has(key)) {
            el.setAttribute('fill', inverted ? '#4DA8FF' : '#3E3E44');
            el.setAttribute('opacity', inverted ? '0.28' : '0.35');
            el.setAttribute('r', '0.95');
            el.classList.remove('mint-bloom', 'red-bloom');
          } else {
            el.setAttribute('fill', '#222228');
            el.setAttribute('opacity', '0.45');
            el.setAttribute('r', '0.8');
            el.classList.remove('mint-bloom', 'red-bloom');
          }

          if (animateRipple) {
            el.style.transform = 'scale(1.35)';
            setTimeout(() => {
              el.style.transform = 'scale(1)';
            }, 130 + delay);
          }
        });
      }

      const toggleBtn = document.getElementById('invert-toggle');
      const toggleLabel = document.getElementById('invert-label');
      const toggleTrack = document.getElementById('invert-track');
      const toggleThumb = document.getElementById('invert-thumb');
      const statusLine = document.getElementById('status-line');

      function updateToggleUI() {
        toggleBtn.setAttribute('aria-checked', String(inverted));
        if (inverted) {
          toggleBtn.className = 'pill-glow-on w-auto min-w-[224px] flex items-center justify-between gap-gutter-md rounded-full bg-primary-container border border-primary px-gutter-md py-gutter-sm transition-colors duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary';
          toggleLabel.className = 'font-label text-label-lg text-primary uppercase tracking-widest';
          toggleTrack.className = 'inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-primary p-0.5 transition-colors duration-state-change';
          toggleThumb.className = 'h-4 w-4 rounded-full bg-on-primary translate-x-4 transition-transform duration-state-change ease-state-change';
          statusLine.textContent = 'MOUSE: INVERTED · TRACKPAD: UNTOUCHED';
          statusLine.className = 'font-label text-label-md text-primary text-center uppercase tracking-wider';
        } else {
          toggleBtn.className = 'pill-glow-off w-auto min-w-[224px] flex items-center justify-between gap-gutter-md rounded-full bg-surface-container border border-outline-variant px-gutter-md py-gutter-sm transition-colors duration-state-change ease-state-change focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-outline';
          toggleLabel.className = 'font-label text-label-lg text-on-surface-variant uppercase tracking-widest';
          toggleTrack.className = 'inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-surface-container-highest p-0.5 transition-colors duration-state-change';
          toggleThumb.className = 'h-4 w-4 rounded-full bg-on-surface-variant translate-x-0 transition-transform duration-state-change ease-state-change';
          statusLine.textContent = 'MOUSE: STANDARD · TRACKPAD: UNTOUCHED';
          statusLine.className = 'font-label text-label-md text-on-surface-variant text-center uppercase tracking-wider';
        }
      }

      toggleBtn.addEventListener('click', () => {
        inverted = !inverted;
        updateToggleUI();
        renderMatrix(true);
      });

      document.querySelectorAll('[data-mini-switch]').forEach((sw) => {
        sw.addEventListener('click', () => {
          const on = sw.getAttribute('aria-checked') === 'true';
          const next = !on;
          sw.setAttribute('aria-checked', String(next));
          const thumb = sw.firstElementChild;
          if (next) {
            sw.className = 'relative inline-flex h-4 w-7 shrink-0 items-center rounded-full bg-primary-container border border-primary p-0.5 transition-colors duration-state-change';
            thumb.className = 'h-2.5 w-2.5 rounded-full bg-primary translate-x-3 transition-transform duration-state-change';
          } else {
            sw.className = 'relative inline-flex h-4 w-7 shrink-0 items-center rounded-full bg-surface-container-highest border border-outline-variant p-0.5 transition-colors duration-state-change';
            thumb.className = 'h-2.5 w-2.5 rounded-full bg-on-surface-variant translate-x-0 transition-transform duration-state-change';
          }
        });
      });

      renderMatrix(false);
    })();
  </script>
